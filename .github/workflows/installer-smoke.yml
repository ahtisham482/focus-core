# Installs the built installer on a fresh Windows runner, launches the
# installed product, and smoke-tests that it actually serves.
#
# Why this exists: unit tests prove the code is correct; this proves the
# shipped artifact works -- the installer installs, the app launches,
# and the dashboard answers on a real Windows machine, with no human
# in the loop. Runs on every push to main plus manual dispatch.
#
# Triggers:
#   - push to main            -> build installer, install it, smoke-test
#   - manual dispatch         -> same, on demand

name: Installer smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build-machine Pillow comes from the hash-locked pin in
      # requirements-lock.txt via the tested installer/install_locked_pin.py
      # (pip only accepts --hash inside a requirements file, so the helper
      # installs with --require-hashes -r; the same helper serves the
      # release workflow, so the two cannot drift).
      - name: Install build deps
        run: python installer/install_locked_pin.py Pillow

      - name: Stage the app (embedded Python + code)
        run: python installer/build.py --version "0.0.0.${{ github.run_number }}" --repo "${{ github.repository }}"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\installer.iss /DAppVersion="0.0.0.${{ github.run_number }}"
          Get-ChildItem installer\FocusCore-Setup-*.exe

      - name: Record installer size (roadmap 1.17)
        # Installer download size tracked per release: emitted as a
        # run artifact so sizes can be compared across releases.
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\FocusCore-Setup-*.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "No installer exe found" }
          $line = "installer=$($exe.Name) bytes=$($exe.Length)"
          Write-Host $line
          Set-Content -Path installer-size.txt -Value $line

      - name: Upload installer size
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-size
          path: installer-size.txt
          if-no-files-found: warn

      - name: Snapshot machine state before install (roadmap 2.4)
        # Roadmap 2.4's bar: install -> use -> uninstall (with the
        # data wipe) leaves no residue. Capture the machine state now
        # so the residue check at the end can diff against it.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:RUNNER_TEMP\residue"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Get-ScheduledTask |
            ForEach-Object { "$($_.TaskPath)$($_.TaskName)" } |
            Sort-Object | Out-File "$dir\before-tasks.txt"
          $run = Get-ItemProperty `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
            -ErrorAction SilentlyContinue
          $runLines = @()
          if ($run) {
            $runLines = @($run.PSObject.Properties |
              Where-Object { $_.Name -notlike 'PS*' } |
              ForEach-Object { "$($_.Name)=$($_.Value)" } | Sort-Object)
          }
          $runLines | Out-File "$dir\before-run.txt"
          $startup = [Environment]::GetFolderPath('Startup')
          Get-ChildItem $startup -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Sort-Object |
            Out-File "$dir\before-startup.txt"
          Get-ChildItem `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty PSChildName | Sort-Object |
            Out-File "$dir\before-uninstall-keys.txt"
          "app=$(Test-Path "$env:LOCALAPPDATA\Programs\Focus Core")" |
            Out-File "$dir\before-presence.txt"
          "data=$(Test-Path "$env:LOCALAPPDATA\Focus Core")" |
            Out-File -Append "$dir\before-presence.txt"
          Write-Host "Machine-state snapshot saved to $dir"

      - name: Silent-install the product
        # Fail fast if the installer hangs: a healthy silent install takes
        # a few minutes. Without this, a hang burns the whole 30-minute
        # job timeout and the run shows "cancelled" with no installer log.
        timeout-minutes: 15
        shell: pwsh
        run: |
          # NOTE: do NOT use `& $exe ...` + $LASTEXITCODE here. On 2026-09-29
          # the call operator returned while the installer was still
          # starting (empty $LASTEXITCODE, and $null -ne 0 is $true), so the
          # step failed even though the installer was copying files fine.
          # NOTE 2 (2026-09-29): do NOT use Start-Process -Wait either. The
          # silent [Run] entry auto-launches the app (by design, for silent
          # updates) and -Wait holds the step open until that app exits --
          # run 36531531947 showed Setup finished ("Log closed") yet the
          # step burned the whole 15-minute timeout. Poll for Setup's own
          # exit instead, then stop the auto-launched app below.
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem installer\FocusCore-Setup-*.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "No installer exe found" }
          $log = "$env:RUNNER_TEMP\install.log"
          $proc = Start-Process -FilePath $exe.FullName `
                    -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", `
                      "/NORESTART", "/LOG=$log" `
                    -PassThru
          $deadline = (Get-Date).AddMinutes(10)
          while (-not $proc.HasExited) {
            if ((Get-Date) -gt $deadline) {
              throw "installer hung (setup.exe never exited)"
            }
            Start-Sleep -Seconds 5
          }
          if ($proc.ExitCode -ne 0) {
            throw "Installer exited with code $($proc.ExitCode)"
          }
          # Belt and braces: make sure the installer really finished writing
          # files (shortcut present, no setup process left), not just that
          # its bootstrap process exited.
          $lnk = "$env:USERPROFILE\Desktop\Focus Core.lnk"
          $deadline = (Get-Date).AddSeconds(300)
          while ((Get-Date) -lt $deadline) {
            $stillRunning = Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessName -like "FocusCore-Setup*" }
            if ((-not $stillRunning) -and (Test-Path $lnk)) { break }
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path $lnk)) {
            throw "Installer exited 0 but the desktop shortcut never appeared"
          }
          Write-Host "Installed: $($exe.Name)"
          # The silent [Run] entry auto-launched the app. Prove it fired,
          # then stop that copy: a running app pins this step's process
          # tree open, and the next step starts the app itself from a
          # known-clean state.
          $launched = Get-CimInstance Win32_Process `
                         -Filter "Name = 'pythonw.exe'" |
            Where-Object { $_.CommandLine -like "*focuscore.launcher*" }
          if (-not $launched) {
            throw "silent install did not auto-launch the app"
          }
          $launched | ForEach-Object {
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            $left = Get-CimInstance Win32_Process `
                       -Filter "Name = 'pythonw.exe'" |
              Where-Object { $_.CommandLine -like "*focuscore.launcher*" }
            if (-not $left) { break }
            Start-Sleep -Seconds 2
          }
          Write-Host "Auto-launch verified; app stopped"

      - name: Verify install layout
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Focus Core"
          foreach ($p in @("$app\python\python.exe",
                           "$app\python\pythonw.exe",
                           "$app\icon.ico")) {
            if (-not (Test-Path $p)) { throw "Missing: $p" }
          }
          $lnk = "$env:USERPROFILE\Desktop\Focus Core.lnk"
          if (-not (Test-Path $lnk)) { throw "Missing desktop shortcut" }
          Write-Host "Install layout OK"

      - name: Wait for the installed app to serve
        shell: pwsh
        run: |
          # The install step stops the auto-launched copy so its step can
          # end; start the app ourselves here (no -Wait: the server runs
          # until the job ends) and wait for it to answer.
          $appDir = "$env:LOCALAPPDATA\Programs\Focus Core"
          Start-Process -FilePath "$appDir\python\pythonw.exe" `
            -ArgumentList "-m", "focuscore.launcher" `
            -WorkingDirectory $appDir
          $deadline = (Get-Date).AddSeconds(120)
          $r = $null
          do {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:5000/" `
                     -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { break }
            } catch { }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if (-not $r -or $r.StatusCode -ne 200) {
            throw "Installed app never answered on 127.0.0.1:5000"
          }
          Write-Host "Server answered HTTP 200"

      - name: Smoke-test key pages
        shell: pwsh
        run: |
          foreach ($p in @("/", "/focus", "/goals")) {
            $r = Invoke-WebRequest `
                   -Uri "http://127.0.0.1:5000$p" `
                   -UseBasicParsing -TimeoutSec 10
            if ($r.StatusCode -ne 200) { throw "$p -> $($r.StatusCode)" }
            if ($r.Content -notmatch "(?i)focus core") {
              throw "$p body does not mention Focus Core"
            }
            Write-Host "$p OK ($($r.RawContentLength) bytes)"
          }

      - name: Human-like UI test (Playwright)
        # Drives the INSTALLED app in a real Chromium the way a person
        # would: navigates pages, fills the goal form, accepts the delete
        # confirm dialog, asserts visible results, screenshots every step,
        # and fails on any JS console/page error. See smoke/e2e_windows.py.
        shell: pwsh
        run: |
          pip install playwright
          playwright install chromium
          python smoke/e2e_windows.py --base-url "http://127.0.0.1:5000" `
            --shots-dir "$env:RUNNER_TEMP\e2e-shots"

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-e2e-shots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: warn

      - name: Screenshot the running app (visual check)
        # I review this screenshot myself after the run: it shows the real
        # app window AND the taskbar, so the Windows app-identity work
        # (own taskbar icon/name instead of Python's) is verified by eye on
        # a real Windows machine -- no human PC needed. Best-effort: never
        # fails the job; a missing window still uploads the desktop capture
        # for debugging.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $shot = "$env:RUNNER_TEMP\focuscore-window.png"
          # Wait for the native window, then bring it to the front.
          $deadline = (Get-Date).AddSeconds(60)
          $found = $false
          while ((Get-Date) -lt $deadline) {
            $w = Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowTitle -eq "Focus Core" }
            if ($w) { $found = $true; break }
            Start-Sleep -Seconds 2
          }
          if ($found) {
            Write-Host "Focus Core window found; bringing to front"
            (New-Object -ComObject wscript.shell).AppActivate("Focus Core") | Out-Null
            Start-Sleep -Seconds 2
          } else {
            Write-Host "##[warning]No 'Focus Core' window appeared; capturing desktop anyway"
          }
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          try {
            $g.CopyFromScreen($bounds.Location,
              [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "Screenshot saved: $shot ($($bounds.Width)x$($bounds.Height))"
          } finally {
            $g.Dispose(); $bmp.Dispose()
          }

      - name: Upload app screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-app-screenshot
          path: ${{ runner.temp }}/focuscore-window.png
          if-no-files-found: warn

      - name: Restore a dev backup into the installed copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 1. Build a fake "old laptop": dev database with a marker row,
          #    backed up the same way the app backs up (checksum sidecar
          #    included), then dropped into the installed backup folder.
          $mk = @'
          import os, shutil, sqlite3, sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from focuscore import backup as backup_mod
          from focuscore import store

          dev_db = os.path.join(os.environ["RUNNER_TEMP"], "dev-focuscore.db")
          if os.path.exists(dev_db):
              os.remove(dev_db)
          store.init_db(dev_db)
          conn = sqlite3.connect(dev_db)
          conn.execute(
              "INSERT INTO goals (name, direction, target_type, created_at)"
              " VALUES ('CI-RESTORE-MARKER', 'at_least', 'category',"
              " '2026-09-29')")
          conn.commit()
          conn.close()

          staging = os.path.join(os.environ["RUNNER_TEMP"], "dev-backups")
          made = backup_mod.create_backup(db_path=dev_db, dest_dir=staging)

          target_dir = os.path.join(os.environ["LOCALAPPDATA"],
                                    "Focus Core", "backups")
          os.makedirs(target_dir, exist_ok=True)
          shutil.copy2(str(made), os.path.join(target_dir, made.name))
          shutil.copy2(str(made) + ".sha256",
                       os.path.join(target_dir, made.name + ".sha256"))
          print("BACKUP_NAME=" + made.name)
          '@
          $mk | Out-File -Encoding utf8 "$env:RUNNER_TEMP\mkdevbackup.py"
          $out = python "$env:RUNNER_TEMP\mkdevbackup.py"
          if ($LASTEXITCODE -ne 0) { throw "mkdevbackup.py failed" }
          $out | ForEach-Object { Write-Host $_ }
          $backupName = ($out | Where-Object { $_ -match '^BACKUP_NAME=' }) `
            -replace '^BACKUP_NAME=', ''
          if (-not $backupName) { throw "dev backup was not created" }

          # 2. Restore it through the installed app's real HTTP endpoint.
          $r = Invoke-WebRequest `
                 -Uri "http://127.0.0.1:5000/backup/restore" `
                 -Method POST -Body @{ name = $backupName } `
                 -UseBasicParsing -TimeoutSec 60
          if ($r.StatusCode -ne 200) {
            throw "restore -> $($r.StatusCode)"
          }
          if ($r.Content -notmatch "Backup restored") {
            throw "restore page did not confirm success"
          }
          Write-Host "Restore endpoint OK ($backupName)"

          # 3. The marker row from the dev backup must now be in the
          #    installed database file, and a pre-restore safety copy
          #    must exist next to it.
          $verify = @'
          import glob, os, sqlite3
          data_dir = os.path.join(os.environ["LOCALAPPDATA"], "Focus Core")
          db = os.path.join(data_dir, "focuscore.db")
          conn = sqlite3.connect(db)
          row = conn.execute(
              "SELECT name FROM goals WHERE name='CI-RESTORE-MARKER'"
          ).fetchone()
          conn.close()
          if not row:
              raise SystemExit("marker goal missing after restore")
          safety = glob.glob(
              os.path.join(data_dir, "focuscore.db.pre-restore-*"))
          if not safety:
              raise SystemExit("no pre-restore safety copy found")
          print("marker present in installed db; safety copy: "
                + os.path.basename(safety[0]))
          '@
          $verify | Out-File -Encoding utf8 "$env:RUNNER_TEMP\verifyrestore.py"
          python "$env:RUNNER_TEMP\verifyrestore.py"
          if ($LASTEXITCODE -ne 0) { throw "verifyrestore.py failed" }

          # 4. The server must still be answering after the atomic swap.
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:5000/" `
                 -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "/ -> $($r.StatusCode)" }
          Write-Host "Server alive after restore"

      - name: Silent-uninstall the product
        # The documented uninstall command (docs/enterprise-deploy.md),
        # run exactly as IT would: proves the silent uninstall removes
        # the program while user data is deliberately kept.
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:LOCALAPPDATA\Programs\Focus Core"
          $uninstaller = "$app\unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller missing: $uninstaller"
          }
          # Stop the running app first (as the install step does): the
          # uninstaller cannot delete files a running process holds open.
          # The launcher runs the dashboard as a child process
          # (pythonw -m dashboard.app), so matching the launcher's command
          # line alone leaves that child alive with the program files
          # locked -- stop every process running from the install folder.
          Get-CimInstance Win32_Process |
            Where-Object { $_.ExecutablePath -and
              $_.ExecutablePath.StartsWith($app) } |
            ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
          # Wait until no process runs from the install folder anymore,
          # so the uninstaller can delete every file.
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $deadline) {
            $stillAlive = Get-CimInstance Win32_Process |
              Where-Object { $_.ExecutablePath -and
                $_.ExecutablePath.StartsWith($app) }
            if (-not $stillAlive) { break }
            Start-Sleep -Seconds 2
          }
          $log = "$env:RUNNER_TEMP\uninstall.log"
          Start-Process -FilePath $uninstaller `
                    -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", `
                      "/NORESTART", "/LOG=$log"
          # unins000.exe hands off to a temporary copy of itself, so
          # the first process can exit before the work is done. Wait
          # for every unins* process to finish AND the program folder
          # to actually disappear.
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $stillRunning = Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessName -like "unins*" }
            if ((-not $stillRunning) -and (-not (Test-Path $app))) { break }
            Start-Sleep -Seconds 5
          }
          if (Test-Path $app) {
            throw "Silent uninstall finished but $app is still there"
          }
          # By design the uninstaller keeps user data (so reinstalling
          # later brings history back): prove it survived.
          $data = "$env:LOCALAPPDATA\Focus Core\focuscore.db"
          if (-not (Test-Path $data)) {
            throw "Uninstall deleted user data that must be kept: $data"
          }
          Write-Host "Silent uninstall OK; user data kept"

      - name: Reinstall silently (roadmap 2.4 wipe test setup)
        # The wipe needs a second install -> uninstall cycle: the
        # first cycle (above) proved the default uninstall keeps the
        # data; this one proves /DELETEDATA removes it.
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem installer\FocusCore-Setup-*.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "No installer exe found" }
          $log = "$env:RUNNER_TEMP\reinstall.log"
          $proc = Start-Process -FilePath $exe.FullName `
                    -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", `
                      "/NORESTART", "/LOG=$log" `
                    -PassThru
          $deadline = (Get-Date).AddMinutes(10)
          while (-not $proc.HasExited) {
            if ((Get-Date) -gt $deadline) {
              throw "reinstall hung (setup.exe never exited)"
            }
            Start-Sleep -Seconds 5
          }
          if ($proc.ExitCode -ne 0) {
            throw "Reinstall exited with code $($proc.ExitCode)"
          }
          $app = "$env:LOCALAPPDATA\Programs\Focus Core"
          if (-not (Test-Path "$app\unins000.exe")) {
            throw "Reinstall did not restore the uninstaller"
          }
          # The data folder kept by the first cycle must still be
          # there, or the wipe assertion below proves nothing.
          if (-not (Test-Path "$env:LOCALAPPDATA\Focus Core")) {
            throw "Data folder missing before wipe test"
          }
          Write-Host "Reinstalled for wipe test"

      - name: Silent-uninstall with data wipe (roadmap 2.4)
        # The documented offboarding command (docs/enterprise-deploy.md):
        # the default silent uninstall plus /DELETEDATA, which must
        # remove the data folder too.
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:LOCALAPPDATA\Programs\Focus Core"
          $uninstaller = "$app\unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller missing: $uninstaller"
          }
          # Stop every process running from the install folder first:
          # the uninstaller cannot delete files a running process
          # holds open (the dashboard is a child of the launcher).
          Get-CimInstance Win32_Process |
            Where-Object { $_.ExecutablePath -and
              $_.ExecutablePath.StartsWith($app) } |
            ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $deadline) {
            $stillAlive = Get-CimInstance Win32_Process |
              Where-Object { $_.ExecutablePath -and
                $_.ExecutablePath.StartsWith($app) }
            if (-not $stillAlive) { break }
            Start-Sleep -Seconds 2
          }
          $log = "$env:RUNNER_TEMP\uninstall-wipe.log"
          Start-Process -FilePath $uninstaller `
                    -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", `
                      "/NORESTART", "/DELETEDATA", "/LOG=$log"
          # Same handoff wait as the default uninstall above.
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $stillRunning = Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessName -like "unins*" }
            if ((-not $stillRunning) -and (-not (Test-Path $app))) { break }
            Start-Sleep -Seconds 5
          }
          if (Test-Path $app) {
            throw "Wipe uninstall finished but $app is still there"
          }
          if (Test-Path "$env:LOCALAPPDATA\Focus Core") {
            throw "/DELETEDATA uninstall kept the data folder"
          }
          Write-Host "Wipe uninstall OK; program and data removed"

      - name: Residue check (roadmap 2.4)
        # Clean diff is the bar: after install -> use -> wipe
        # uninstall, the machine must look exactly as it did before
        # the install (scheduled tasks, Startup entries, HKCU Run
        # key, uninstall keys, program/data folders).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:RUNNER_TEMP\residue"
          Get-ScheduledTask |
            ForEach-Object { "$($_.TaskPath)$($_.TaskName)" } |
            Sort-Object | Out-File "$dir\after-tasks.txt"
          $run = Get-ItemProperty `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
            -ErrorAction SilentlyContinue
          $runLines = @()
          if ($run) {
            $runLines = @($run.PSObject.Properties |
              Where-Object { $_.Name -notlike 'PS*' } |
              ForEach-Object { "$($_.Name)=$($_.Value)" } | Sort-Object)
          }
          $runLines | Out-File "$dir\after-run.txt"
          $startup = [Environment]::GetFolderPath('Startup')
          Get-ChildItem $startup -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Sort-Object |
            Out-File "$dir\after-startup.txt"
          Get-ChildItem `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty PSChildName | Sort-Object |
            Out-File "$dir\after-uninstall-keys.txt"
          "app=$(Test-Path "$env:LOCALAPPDATA\Programs\Focus Core")" |
            Out-File "$dir\after-presence.txt"
          "data=$(Test-Path "$env:LOCALAPPDATA\Focus Core")" |
            Out-File -Append "$dir\after-presence.txt"
          # The Focus Core uninstall key itself must be gone, not
          # just moved: Inno names it after the AppId + "_is1".
          $leftover = Get-Content "$dir\after-uninstall-keys.txt" |
            Where-Object {
              $_ -like '*C7A3F2E1-8B4D-4F6A-9E2C-1D5A7B3F9E2C4*' }
          if ($leftover) {
            throw "Focus Core uninstall key left behind: $leftover"
          }
          $failed = $false
          foreach ($name in @('tasks', 'run', 'startup',
                             'uninstall-keys', 'presence')) {
            $diff = Compare-Object `
              @(Get-Content "$dir\before-$name.txt") `
              @(Get-Content "$dir\after-$name.txt")
            if ($diff) {
              $failed = $true
              $diff | Format-Table -AutoSize |
                Out-File "$dir\diff-$name.txt"
              Write-Host "Residue diff in $name (see artifact)"
            }
          }
          if ($failed) { throw "Machine-state residue diff not clean" }
          Write-Host "Residue check OK: machine state identical"

      - name: Upload residue snapshots on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-residue-snapshots
          path: |
            ${{ runner.temp }}/residue
            ${{ runner.temp }}/uninstall-wipe.log
          if-no-files-found: warn

      - name: Upload install log on failure
        # Include cancelled(): a hung installer hits the step timeout above
        # and the job is cancelled -- the log is the only way to see why.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-install-log
          path: ${{ runner.temp }}/install.log

      - name: Upload uninstall log on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-uninstall-log
          path: ${{ runner.temp }}/uninstall.log
          if-no-files-found: warn

  # Roadmap 2.3: the offline flavor bundles the full WebView2 standalone
  # installer (~200 MB) instead of the tiny online bootstrapper, so the
  # app installs on machines with no network. This job proves the flavor
  # stages, compiles, and names itself correctly on a real Windows
  # runner. It does NOT install the flavor (the runner already has
  # WebView2, so the NeedsWebView2 branch would be a no-op either way)
  # and it does NOT upload the ~200 MB artifact.
  offline-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python installer/install_locked_pin.py Pillow

      - name: Stage the app (offline flavor)
        run: python installer/build.py --version "0.0.0.${{ github.run_number }}" --repo "${{ github.repository }}" --webview2-offline

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the offline installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\installer.iss /DAppVersion="0.0.0.${{ github.run_number }}" /DWebView2Offline
          Get-ChildItem installer\FocusCore-Setup-*-offline.exe

      - name: Assert offline flavor contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem installer\FocusCore-Setup-*-offline.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "No -offline installer exe found" }
          Write-Host "Offline installer: $($exe.Name)"
          $standalone = Get-Item installer\staging\webview2standalone.exe
          $mb = [math]::Round($standalone.Length / 1MB, 1)
          # Sanity band: the standalone installer is ~200 MB. The online
          # bootstrapper is ~2 MB -- anything small here means the wrong
          # file got staged.
          if ($standalone.Length -lt 100MB -or $standalone.Length -gt 300MB) {
            throw "unexpected standalone size: $mb MB"
          }
          if (Test-Path installer\staging\webview2bootstrapper.exe) {
            throw "offline flavor must not stage the bootstrapper"
          }
          Write-Host "Offline flavor OK: standalone $mb MB, no bootstrapper"


  # Roadmap 2.6: the per-machine flavor (PrivilegesRequired=admin,
  # {autopf} target, its own AppId). Runners are admin, so this job
  # actually installs and uninstalls the flavor -- the only proof the
  # admin flavor works end to end. It does NOT upload the artifact.
  machine-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python installer/install_locked_pin.py Pillow

      - name: Stage the app (machine flavor)
        run: python installer/build.py --version "0.0.0.${{ github.run_number }}" --repo "${{ github.repository }}" --per-machine

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the machine installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\installer.iss /DAppVersion="0.0.0.${{ github.run_number }}" /DPerMachine
          Get-ChildItem installer\FocusCore-Setup-*-machine.exe

      - name: Assert machine artifact name
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem installer\FocusCore-Setup-*-machine.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "No -machine installer exe found" }
          if ($exe.Name -like "*-offline*") {
            throw "machine job must not build the offline flavor"
          }
          Write-Host "Machine installer: $($exe.Name)"

      - name: Silent-install the machine flavor
        # The documented per-machine install command
        # (docs/enterprise-deploy.md), run as IT would.
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem installer\FocusCore-Setup-*-machine.exe |
                 Select-Object -First 1
          & $exe.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART `
            /LOG="$env:TEMP\FocusCore-machine-install.log"
          if ($LASTEXITCODE -ne 0) { throw "machine install failed: $LASTEXITCODE" }
          if (-not (Test-Path "C:\Program Files\Focus Core\python\pythonw.exe")) {
            throw "machine install did not land in {autopf}"
          }
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\" +
                 "{FAFD1C6B-54C9-4A1A-AD3C-8BE1DD383D28}_is1"
          if (-not (Test-Path $key)) { throw "HKLM uninstall key missing" }
          Write-Host "Machine install OK: Program Files + HKLM key"

      - name: Silent-uninstall the machine flavor
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "C:\Program Files\Focus Core"
          $uninstaller = "$app\unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller missing: $uninstaller"
          }
          # Stop the running app first (the silent install launches it):
          # the uninstaller cannot delete files a running process holds.
          Get-CimInstance Win32_Process |
            Where-Object { $_.ExecutablePath -and
              $_.ExecutablePath.StartsWith($app) } |
            ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $deadline) {
            $stillAlive = Get-CimInstance Win32_Process |
              Where-Object { $_.ExecutablePath -and
                $_.ExecutablePath.StartsWith($app) }
            if (-not $stillAlive) { break }
            Start-Sleep -Seconds 2
          }
          $log = "$env:RUNNER_TEMP\machine-uninstall.log"
          Start-Process -FilePath $uninstaller `
                    -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", `
                      "/NORESTART", "/LOG=$log"
          # unins000.exe hands off to a temporary copy of itself, so
          # wait for every unins* process to finish AND the program
          # folder to actually disappear.
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $stillRunning = Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessName -like "unins*" }
            if ((-not $stillRunning) -and (-not (Test-Path $app))) { break }
            Start-Sleep -Seconds 5
          }
          if (Test-Path $app) {
            throw "Silent uninstall finished but $app is still there"
          }
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\" +
                 "{FAFD1C6B-54C9-4A1A-AD3C-8BE1DD383D28}_is1"
          if (Test-Path $key) { throw "HKLM uninstall key remains" }
          Write-Host "Machine uninstall OK"
