# Builds the zero-setup Windows installer (Sprint 2, Phase 2).
#
# Triggers:
#   - push a tag like v1.3.0  -> builds + attaches FocusCore-Setup-*.exe
#                                to the GitHub Release
#   - manual dispatch          -> builds, keeps the exe as an artifact

name: Build installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.3.0"
        required: true

permissions:
  contents: write  # needed to attach the exe to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "${{ inputs.version }}"
          }
          if (-not $v) { throw "No version given" }
          "VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Building installer for version $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install pillow

      - name: Stage the app (embedded Python + code)
        run: python installer/build.py --version "${{ env.VERSION }}" --repo "${{ github.repository }}"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\installer.iss /DAppVersion="${{ env.VERSION }}"
          Get-ChildItem installer\FocusCore-Setup-*.exe

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\FocusCore-Setup-*.exe |
            Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" |
            Out-File -FilePath installer\SHA256SUMS -Encoding ascii
          Get-Content installer\SHA256SUMS

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusCore-Setup-${{ env.VERSION }}
          path: |
            installer/FocusCore-Setup-*.exe
            installer/SHA256SUMS

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # The updater verifies the exe against SHA256SUMS before
          # executing it (roadmap 0.1); both files must ship together.
          files: |
            installer/FocusCore-Setup-*.exe
            installer/SHA256SUMS
          # Professional release page: one obvious download, no confusion
          # with GitHub's auto-attached "Source code (zip)" (raw code only).
          body: |
            ## Download

            **Get `FocusCore-Setup-${{ env.VERSION }}.exe` below — that is the installer.**
            Do NOT download "Source code (zip)"; that is the raw code, for developers only.

            ## Install (about 2 minutes)

            1. Download and double-click `FocusCore-Setup-${{ env.VERSION }}.exe`.
            2. If Windows SmartScreen warns about an unknown publisher, click
               **More info → Run anyway**. (The installer is not code-signed yet;
               it touches nothing outside its own folder.)
            3. Click Next → Next. A Focus Core icon appears on your desktop —
               double-click it. No other software needed.

            **You need:** 64-bit Windows 10 or 11. Python and every component
            are bundled inside the setup — nothing to install first.

            ## What's new

            Full changelog: https://github.com/ahtisham482/focus-core/releases

            ## Help

            Inside the app: the Help menu (plain-English guides). Something wrong?
            https://github.com/ahtisham482/focus-core/issues

            ## Code signing policy

            Focus Core is applying to [SignPath Foundation](https://signpath.org)
            for free open-source code signing; until it is approved, published
            builds are unsigned. Full policy:
            https://github.com/ahtisham482/focus-core#code-signing-policy
