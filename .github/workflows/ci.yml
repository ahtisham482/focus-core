name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Weekly run (roadmap 1.2): catches windows-latest image drift and
  # newly published CVEs even when nothing is pushed for a while.
  # Monday 06:00 UTC. Scheduled runs only fire from the default branch.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  lint:
    name: Ruff lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (pinned, roadmap 1.2; CI-only tool)
        run: pip install ruff==0.16.9
      # Lint policy (orchestrator decision, Sprint 1): error-level rules only
      # (E = pycodestyle errors, F = pyflakes). The full default ruleset
      # reports ~1.3k pre-existing style nits (mostly UP031 %-formatting)
      # across this codebase; cleaning those is parked in ROADMAP.md.
      # The gate below enforces zero real errors.
      - name: Ruff check
        run: ruff check --select E,F focuscore dashboard tests
      # Ratchet (roadmap 1.2): the full-default-ruleset violation count
      # may only shrink. Baseline in .ruff-baseline (ruff version and
      # count move together); refresh after an intentional cleanup with
      # `python installer/check_ruff_ratchet.py --refresh` and commit
      # .ruff-baseline. Never raise the count to pass a failing run.
      - name: Ruff ratchet (full default ruleset can only shrink)
        run: python installer/check_ruff_ratchet.py
      # Mypy ratchet (roadmap 3.4): NON-BLOCKING. mypy findings never
      # fail CI on their own -- this step runs only the ratchet, which
      # fails when the error count on the annotated modules
      # (focuscore/store.py + focuscore/money.py) rises above the
      # committed .mypy-baseline. Refresh after an intentional cleanup
      # with `python installer/check_mypy_ratchet.py --refresh` and
      # commit .mypy-baseline. Never raise the count to pass a run.
      - name: Install mypy (pinned, roadmap 3.4; CI-only tool)
        run: pip install mypy==2.4.0
      - name: Mypy ratchet (annotated-module errors can only shrink)
        run: python installer/check_mypy_ratchet.py

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit (pinned, roadmap 1.2; CI-only tool)
        run: pip install pip-audit==2.10.1
      # Both files, on purpose: requirements.txt is what this CI tests
      # (floating ranges), requirements-lock.txt is what the installer
      # ships (hash-locked, roadmap 1.1). A known vulnerability in
      # either fails the job.
      - name: Audit requirements.txt (what CI tests)
        run: pip-audit -r requirements.txt
      # --disable-pip: audit the lock's pinned versions exactly as
      # written. The lock's hashes name the Windows wheels, so a Linux
      # runner must not resolve-and-install it (it would pick Linux
      # wheels and fail the hash check); hash enforcement happens in
      # the installer build on Windows (roadmap 1.1).
      - name: Audit requirements-lock.txt (what the installer ships)
        run: pip-audit --disable-pip -r requirements-lock.txt

  test:
    name: pytest (Python 3.12, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Coverage gate (roadmap 1.8): term-missing report, floor of 69
      # measured 71.9% total over focuscore+dashboard on 2026-10-01
      # (focuscore 72.2%, dashboard 70.8%); the floor is the measured
      # total minus 2 points so ordinary platform jitter cannot fail
      # the gate. Ratchet: raise the floor as coverage improves --
      # never lower it to pass a failing run.
      - name: Run test suite
        run: pytest -q --cov=focuscore --cov=dashboard --cov-report=term-missing --cov-fail-under=69

  weekly-soak:
    name: Weekly footprint soak (roadmap 1.17)
    # Roadmap 1.17: the 1-hour idle soak lives ONLY in the weekly
    # scheduled run -- never on push or PR. The ceilings (idle CPU
    # < 1%, RSS < 150 MB) are pinned in
    # tests/test_performance_footprint.py and fail like tests.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Idle footprint soak (1 hour)
        env:
          FOCUSCORE_SOAK_SECONDS: "3600"
        run: python -m pytest tests/test_performance_soak.py -m soak -x -q

  artifact:
    name: Build release zip
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip repo (exclude .git, caches, backups, databases)
        shell: python
        run: |
          import pathlib, zipfile
          root = pathlib.Path(".")
          skip_dirs = {".git", "__pycache__", ".pytest_cache", "backups"}
          with zipfile.ZipFile("focus-core-v1.1.0.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root)
                  if rel.name == "focus-core-v1.1.0.zip":
                      continue
                  if any(part in skip_dirs for part in rel.parts):
                      continue
                  if rel.suffix in {".db", ".pyc"}:
                      continue
                  z.write(p, rel)
      - name: Install dependencies (for smoke test)
        run: pip install -r requirements.txt
      - name: Smoke test — import the artifact
        shell: python
        run: |
          import tempfile, zipfile, pathlib, subprocess, sys
          tmp = pathlib.Path(tempfile.mkdtemp(prefix="fc-smoke-"))
          with zipfile.ZipFile("focus-core-v1.1.0.zip") as z:
              z.extractall(tmp)
          r = subprocess.run(
              [sys.executable, "-c", "import dashboard.app; print('smoke ok')"],
              cwd=tmp, capture_output=True, text=True, timeout=120)
          print(r.stdout, r.stderr)
          assert r.returncode == 0 and "smoke ok" in r.stdout, "smoke import failed"
          print("SMOKE OK")
      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: focus-core-v1.1.0
          path: focus-core-v1.1.0.zip
